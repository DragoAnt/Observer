name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    uses: DragoAnt/.github/.github/workflows/dotnet-build.yml@c9f20c11ebd297193a910d965d33bdf37c0d6c42 # main
    with:
      version: 0.0.0-ci.${{ github.run_number }}
      coverage-threshold: 70
      pack: true

  windows:
    name: Build and test (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      CONFIGURATION: Release
      SOLUTION: DragoAnt.Observer.slnx
      RESULTS_DIR: ${{ github.workspace }}/TestResults
      BUILD_PROPS: -p:ContinuousIntegrationBuild=true -p:Version=0.0.0-ci.${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          # shellcheck disable=SC2086
          dotnet restore "$SOLUTION" $BUILD_PROPS

      - name: Build
        run: |
          # shellcheck disable=SC2086
          dotnet build "$SOLUTION" -c "$CONFIGURATION" --no-restore $BUILD_PROPS

      - name: Test
        run: |
          dotnet test --solution "$SOLUTION" -c "$CONFIGURATION" --no-build --no-progress \
            --results-directory "$RESULTS_DIR" --report-xunit-trx

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: ignore
          retention-days: 14
